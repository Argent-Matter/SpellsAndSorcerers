modLoader = "javafml"
loaderVersion = "[${loader_version},)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    logoFile = "logo.png"
    authors = "screret, JuiceyBeans"
    description='''${mod_description}'''
    credits = "JuiceyBeans"

enumExtensions = "META-INF/enum_extensions.json"
# [mods."modernfix:integration"]
# client_entrypoint = "com.gregtechceu.gtceu.integration.modernfix.GTModernFixIntegration"

[[mixins]]
    config = "${mod_id}.mixins.json"
[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "geckolib"
    type = "required"
    embedded = true
    versionRange = "[${geckolib_version},)"
    ordering = "NONE"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        modrinth = "geckolib"
        curseforge = "geckolib"

[[dependencies.${mod_id}]]
    modId = "smartbrainlib"
    type = "required"
    embedded = true
    versionRange = "[${sbl_version},)"
    ordering = "NONE"
    side = "BOTH"
    [dependencies.${mod_id}.mc-publish]
        ignore = false
        modrinth = "smartbrainlib"
        curseforge = "smartbrainlib"

[[dependencies.${mod_id}]]
    modId = "kubejs"
    type = "optional"
    versionRange = "[${kjs_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jei"
    type = "optional"
    versionRange = "[${jei_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "emi"
    type = "optional"
    versionRange = "[${emi_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "roughlyenoughitems"
    type = "optional"
    versionRange = "[${rei_version},)"
    ordering = "NONE"
    side = "BOTH"

#[[dependencies.${mod_id}]]
#    modId = "theoneprobe"
#    type = "optional"
#    versionRange = "[${top_version},)"
#    ordering = "NONE"
#    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "jade"
    type = "optional"
    versionRange = "[${jade_version},)"
    ordering = "NONE"
    side = "BOTH"


[[mods]]
    modId = "modularui"
    version = "${version}"
    displayName = "Modular UI"
    authors = "GregTech Modern team, Brachy"
    description='''Modular UI 2 for modern versions'''
    credits = "Brachy for developing the original library on 1.12, and GregTech Modern team for the port"
[[mixins]]
    config = "modularui.mixins.json"

[[dependencies.modularui]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.modularui]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}]"
    ordering = "NONE"
    side = "BOTH"

