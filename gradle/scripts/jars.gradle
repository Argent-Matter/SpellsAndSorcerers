// Add sources jar to components.java
java {
    withSourcesJar()
}

// hack to avoid a bug in Shadow: https://github.com/GradleUp/shadow/issues/111
tasks.register('shadowBugWorkaround', Jar) {
    dependsOn jarJar
    from jarJar.outputs
}

if (tasks.getNames().contains('shadowJar')) {
    shadowJar {
        from tasks.shadowBugWorkaround
        // This is how the official docs say to do it. I can't get the warning to go away.
        configurations = project.configurations.named('includedLibrary').map { [it] }
        archiveClassifier = null
    }
}

base {
    archivesName = "${project.name}-${libs.versions.minecraft.get()}"
}

afterEvaluate {
    tasks.withType(org.gradle.jvm.tasks.Jar).configureEach {
        destinationDirectory = file('build/libs/')
        manifest.attributes([
                'Specification-Title': project.name,
                'Specification-Version': project.properties.mod_version,
                'Specification-Vendor': project.properties.mod_authors,
                'Implementation-Title': base.archivesName,
                'Implementation-Version': project.version,
                'Implementation-Vendor': project.properties.mod_authors,
        ])
        if (project.file("${project.properties.mod_id}.mixins.json").exists()) {
            manifest.attributes += ([
                    'MixinConfigs': "${project.properties.mod_id}.mixins.json"
            ])
        }

        exclude ".cache"
        exclude "logo_assets"
    }
}
