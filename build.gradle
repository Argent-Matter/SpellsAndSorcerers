plugins {
    id 'java'
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'

    alias libs.plugins.modDevGradle
    alias libs.plugins.spotless
    alias libs.plugins.lombok
    alias libs.plugins.shadow
}

group = project.properties.maven_group
// Formats the mod version to include the loader, Minecraft version, and '-SNAPSHOT-<timestamp>' if enabled.
boolean isSnapshot = System.getenv("SNAPSHOT")
version = "${mod_version}" + (isSnapshot ? "-SNAPSHOT" : "")
boolean isCI = System.getenv("CI") != null

allprojects {
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    // Include resources generated by data generators.
    main.resources {
        srcDir 'src/generated/resources'
    }

    client {
        // The Java plugin does this for the test source set, replicate that here
        compileClasspath += main.output
        runtimeClasspath += client.output + main.output
    }

    test {
        compileClasspath += main.output
        runtimeClasspath += test.output + main.output
    }

    extra {
        compileClasspath += main.output
        runtimeClasspath += extra.output + main.output
    }

    clientExtra {
        compileClasspath += client.output + extra.output
        runtimeClasspath += clientExtra.output + client.output + extra.output
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    extraRuntimeClasspath.extendsFrom extraLocalRuntime
    clientRuntimeClasspath.extendsFrom clientLocalRuntime
    extraClientRuntimeClasspath.extendsFrom clientExtraLocalRuntime

    renderNurseCfg {
        canBeConsumed = false
        canBeResolved = true
    }

    includedLibrary {
        canBeConsumed = false
        canBeResolved = true
    }
}

apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$projectDir/dependencies.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/spotless.gradle"

afterEvaluate {
    allprojects {
        tasks.withType(JavaCompile).configureEach {
            options.encoding = "UTF-8"
            options.compilerArgs << "-Xlint:-removal"
        }

        lombok {
            version = "1.18.38"
        }

        // IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
        idea {
            module {
                downloadSources = true
                downloadJavadoc = true
            }
        }
    }
}
